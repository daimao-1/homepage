<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pengyinuoniubi.xyz</title>
<meta name="description" content="站点导航">
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --accent: #185fa5;
    --hover: #f0f5fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --card: #1e1e1e;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --border: #2e2e2e;
      --accent: #85b7eb;
      --hover: #262626;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 14vh 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header { margin-bottom: 42px; text-align: center; }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: 0.5px; }
  header p { margin-top: 10px; font-size: 14px; color: var(--muted); }
  main { width: 100%; max-width: 560px; }
  nav { display: flex; flex-direction: column; gap: 14px; }
  nav a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  nav a:hover { background: var(--hover); border-color: var(--accent); }
  .info { min-width: 0; }
  .info .name { display: block; font-size: 16px; font-weight: 500; }
  .info .desc { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); }
  .arrow {
    flex-shrink: 0;
    font-size: 18px;
    color: var(--muted);
    transition: transform 0.15s ease, color 0.15s ease;
  }
  nav a:hover .arrow { transform: translateX(3px); color: var(--accent); }
  footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>pengyinuoniubi.xyz</h1>
  <p>站点导航</p>
</header>
<main>
<nav>
  <a href="https://survey.pengyinuoniubi.xyz/">
    <span class="info">
      <span class="name">渡一问卷系统</span>
      <span class="desc">低代码问卷编辑器 · Vue 3 + TypeScript</span>
    </span>
    <span class="arrow">&#8594;</span>
  </a>
  <a href="https://github.com/daimao-1/lowcode-survey">
    <span class="info">
      <span class="name">lowcode-survey</span>
      <span class="desc">问卷系统源码仓库 · GitHub</span>
    </span>
    <span class="arrow">&#8594;</span>
  </a>
</nav>
</main>
<footer>
  <a href="https://survey.pengyinuoniubi.xyz/">survey.pengyinuoniubi.xyz</a>
</footer>
</body>
</html>
